name: Build & Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build and verify
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  android:
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Debug APK and Run Host Unit Tests
        run: ./gradlew :androidApp:assembleDebug testAndroidHostTest --stacktrace

  ios:
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Link ComposeApp iOS Simulator Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Build iosApp in Xcode
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
